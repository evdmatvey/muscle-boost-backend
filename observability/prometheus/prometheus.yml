global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: muscle-boost-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          compose_project: mb-prod
      - targets:
          - host.docker.internal:3001
        labels:
          compose_project: mb-staging
