name: Deploy production

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set image name
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.event.release.tag_name }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${TAG},${IMAGE}:production" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_PATH,IMAGE,RELEASE_TAG
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/muscle-boost-backend}"
            APP_PORT="$(grep -E '^APP_PORT=' "${DEPLOY_PATH}/.env.production" | cut -d= -f2- | tr -d '\r' || true)"
            APP_PORT="${APP_PORT:-3000}"

            cd "${DEPLOY_PATH}"
            if [ -d .git ]; then
              git fetch --tags --force origin
              git checkout -f "${RELEASE_TAG}"
            fi

            export IMAGE
            docker compose -p mb-prod --env-file .env.production pull
            docker compose -p mb-prod --env-file .env.production up -d --force-recreate --remove-orphans

            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:${APP_PORT}/api/health/ready" > /dev/null; then
                echo "Production is ready"
                exit 0
              fi
              sleep 2
            done
            echo "Production readiness check failed"
            docker compose -p mb-prod --env-file .env.production ps
            exit 1
